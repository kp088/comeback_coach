name: Deploy Comeback Coach to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Emergent editor plugins are only needed inside Emergent; skip them here.
      - name: Drop Emergent-only dev packages
        working-directory: frontend
        run: npm pkg delete "devDependencies.@emergentbase/overlay" "devDependencies.@emergentbase/visual-edits"

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --no-lockfile --non-interactive

      - name: Build frontend
        working-directory: frontend
        env:
          # Showcase mode (no backend, everything runs in the browser) is the default.
          # To use a real backend instead, add a repository variable VITE_API_URL under
          # Settings > Secrets and variables > Actions > Variables.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DEMO_MODE: ${{ vars.VITE_API_URL == '' && 'true' || 'false' }}
        run: yarn build --base=/comeback_coach/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
